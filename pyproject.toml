[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pia3-agentes"
version = "0.1.0"
description = "Sistema de agentes IA para la planta PIA-3"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7,<3",
    "paho-mqtt>=2.0,<3",
    "httpx>=0.27,<1",
    "langchain>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "planta-contrato @ git+https://github.com/NovitSoftware/academia2026-tp.git#subdirectory=contrato"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2"
]

[tool.setuptools.packages.find]
where = ["src"]