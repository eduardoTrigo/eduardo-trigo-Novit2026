
# Academia Novit 2026 - PIA-3
# Sistema integrado de seguridad

services:
  agente-planta:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pia3-agente

    restart: unless-stopped

    networks:
      - planta-lan

    labels:
      academia.planta: "pc"

    environment:
      # Conexion MQTT con Mosquitto
      MQTT_HOST: broker
      MQTT_PORT: "1883"

      # API de la planta simulada
      PLANTA_API_URL: http://sim:8100

      # Identificacion de nuestro sistema
      SISTEMA_NOMBRE: Eduardo-Trigo

      # Base persistente SQLite
      PIA3_DB_PATH: /app/data_runtime/seguridad.sqlite3

      # Memoria conversacional (rol de aplicación)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-pia3}
      POSTGRES_USER: ${POSTGRES_USER:-pia3_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-5}

      # Publicacion de alertas desactivada
      # durante las pruebas iniciales
      PIA3_ENABLE_OUTBOX: "1"

      # Cache de modelos STT
      HF_HOME: /app/modelos

      # Proxy de la planta
      HTTP_PROXY: http://enlace:3128
      HTTPS_PROXY: http://enlace:3128
      NO_PROXY: broker,sim,localhost,127.0.0.1

    volumes:
      # Conserva notas y alertas ante reinicios
      - pia3_datos:/app/data_runtime

      # Evita descargar Whisper en cada recreacion
      - pia3_modelos:/app/modelos

    cpus: 2.0
    mem_limit: 2g

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    restart: unless-stopped
    networks:
      - planta-lan
    labels:
      academia.planta: "pc"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pia3}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-pia3_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PIA3_POSTGRES_APP_USER: ${POSTGRES_USER:-pia3_app}
      PIA3_POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:-}
    # Validar aquí para que Compose pueda iniciar el agente por separado sin estas credenciales.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${POSTGRES_PASSWORD:?Configura POSTGRES_ADMIN_PASSWORD}"
        : "$${PIA3_POSTGRES_APP_PASSWORD:?Configura POSTGRES_PASSWORD}"
        if [ "$$POSTGRES_USER" = "$$PIA3_POSTGRES_APP_USER" ] ||
           [ "$$POSTGRES_PASSWORD" = "$$PIA3_POSTGRES_APP_PASSWORD" ]; then
          echo 'PostgreSQL requiere usuarios y contraseñas distintos para administración y aplicación.' >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - pia3_postgres:/var/lib/postgresql/data
      - ./infra/postgres/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
      - ./infra/postgres/002-memoria.sql:/docker-entrypoint-initdb.d/002-memoria.sql:ro
      - ./infra/postgres/003-rag.sql:/docker-entrypoint-initdb.d/003-rag.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$PIA3_POSTGRES_APP_PASSWORD"
          psql -X -w -h 127.0.0.1 -U "$$PIA3_POSTGRES_APP_USER" -d "$$POSTGRES_DB"
          -Atqc "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 1.0
    mem_limit: 1g

networks:
  planta-lan:
    external: true
    name: planta-lan

volumes:
  pia3_datos:
  pia3_modelos:
  pia3_postgres:
